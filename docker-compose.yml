version: '3.8'

services:
  db:
    image: postgres:latest
    environment:
      - PGOPTIONS=--search_path=bakery 
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    build: .
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=1
      - DB_NAME=bakery
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - backend

networks:
  backend:
    driver: bridge
